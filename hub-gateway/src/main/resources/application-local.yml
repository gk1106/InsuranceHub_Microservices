spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/insurancehub
  datasource:
    url: jdbc:mysql://mysql:3306/gateway_db
    username: ${GATEWAY_DB_USER:gateway_app}
    password: ${GATEWAY_DB_PASSWORD:gateway_app}

hub:
  crypto:
    # Allowed to be off only in the local profile (see hub.crypto startup guard, phase 6).
    enabled: false
