spring:
  application:
    name: hub-gateway
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # readiness's own group.include (readinessState + keyRegistry) is deliberately NOT set
      # here: Boot's HealthContributorMembershipValidator fails startup outright if a named
      # group member doesn't exist, and keyRegistry only exists when hub.crypto.enabled=true
      # (KeyRegistryHealthIndicator's own @ConditionalOnProperty) - this file is shared by every
      # profile, including local's own crypto-off default used by most of the phase 5 IT suite.
      # Set only where crypto is actually on: docker-compose.yml's hub-gateway environment, and
      # AbstractHubGatewayCryptoIT's own @DynamicPropertySource (crypto-specific ITs).
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hub:
  crypto:
    enabled: true
    # Container-mount path (docker-compose.yml mounts ./.secrets:/secrets:ro into hub-gateway)
    # - the same single source of truth for every profile that has crypto on, deliberately not
    # overridden per-profile (see application-local.yml's own comment on why: a partial
    # per-profile override of hub.insurers[] hits the same list-binding trap documented there).
    # Harmless when hub.crypto.enabled is false (crypto.KeyRegistry never loads, so never reads
    # this) - which is the case for every IT that hasn't explicitly turned crypto on itself.
    bank-keys:
      - kid: bank-2026
        private-key-path: /secrets/bank-private.pem
  correlation:
    # Explicit even though it's hub-common's default: the insurer's raw request is untrusted
    # input, so reqId/inspId must never come from headers here - only from the decrypted body
    # and the validated JWT, set into MDC by gateway-specific code later in the pipeline.
    trust-inbound-headers: false
  security:
    # cross-cutting.md §4: only trust X-Forwarded-For behind the real ALB. Off here; prod's own
    # config turns it on alongside server.forward-headers-strategy=native.
    trust-forwarded-for: false
  # api-contract.md §1. allowed-cidrs is a placeholder (0.0.0.0/0) pending real insurer IP
  # ranges the spec never supplies (docs/open-questions.md Q13) - config.HubStartupGuard fails
  # startup if this placeholder is still present outside the local profile.
  insurers:
    - insp-id: INSP001
      insp-name: universalsompo
      oauth-client-id: insp001-client
      allowed-cidrs: [0.0.0.0/0]
      public-key-path: /secrets/insp001-public.pem
    - insp-id: INSP002
      insp-name: sbigeneral
      oauth-client-id: insp002-client
      allowed-cidrs: [0.0.0.0/0]
      public-key-path: /secrets/insp002-public.pem
    - insp-id: INSP003
      insp-name: nivabupa
      oauth-client-id: insp003-client
      allowed-cidrs: [0.0.0.0/0]
      public-key-path: /secrets/insp003-public.pem

policy-service:
  base-url: http://policy-service:8081
  # cross-cutting.md §6: connect 2s / read 5s - policy-service never calls anything else, so it
  # has no chained-retry worst case of its own to accommodate.
  connect-timeout: 2s
  read-timeout: 5s

claims-service:
  base-url: http://claims-service:8082
  # 20s, not the generic 5s: claims-service's own worst case for one write call (its own
  # application.yml comment) is 3 attempts x 5s read-timeout + backoff = 15.6s. Leaving this at
  # 5s would mean the gateway answers the insurer roughly 10s before claims-service's own retry
  # budget could possibly finish, making that 15.6s bound moot from here - so read-timeout must
  # stay comfortably above it.
  connect-timeout: 2s
  read-timeout: 20s

resilience4j:
  circuitbreaker:
    instances:
      # record-exceptions is an allow-list: once non-empty, any throwable NOT matching it counts
      # as a SUCCESSFUL call for the sliding window (resilience4j's own semantics) - so a downstream
      # bug that returns a clean 500 (HubErrorCode.INTERNAL_ERROR, not 503) would otherwise never
      # count toward the failure rate and the breaker would never open for it.
      # InternalServerError is deliberately NOT added to retry-exceptions below (cross-cutting.md
      # §6: never retry on 4xx - only connect errors, timeouts and 503; retrying a genuine
      # application bug three times wastes 15.6s without helping) - only the breaker needs to see it.
      policyService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - org.springframework.web.client.ResourceAccessException
      claimsService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      policyService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # cross-cutting.md §6: never retry on 4xx - only connect errors, timeouts and 503.
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.ResourceAccessException
      claimsService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Deliberately narrower than policyService's own allow-list: excludes
        # HttpServerErrorException$ServiceUnavailable. A clean 503 DOWNSTREAM_UNAVAILABLE from
        # claims-service means it already exhausted its own 3 retries against policy-service; an
        # immediate gateway-level retry against the same claims-service instance is very unlikely
        # to land in a healthier moment within milliseconds, and would just repeat a slow,
        # already-failed 15.6s cycle on top of itself. Only "couldn't reach it at all" is worth
        # retrying here.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  bulkhead:
    # cross-cutting.md §6 calls this out specifically for the gateway's own clients (not the
    # domain services) - bounds concurrent in-flight calls to each downstream so one slow
    # dependency can't exhaust the gateway's own request-handling capacity. max-wait-duration: 0
    # fails fast (sheds load) rather than queuing more latency on top of an already-slow
    # dependency.
    instances:
      policyService:
        max-concurrent-calls: 25
        max-wait-duration: 0
      claimsService:
        max-concurrent-calls: 25
        max-wait-duration: 0
