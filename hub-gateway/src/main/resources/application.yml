spring:
  application:
    name: hub-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hub:
  crypto:
    enabled: true
  correlation:
    # Explicit even though it's hub-common's default: the insurer's raw request is untrusted
    # input, so reqId/inspId must never come from headers here - only from the decrypted body
    # and the validated JWT, set into MDC by gateway-specific code later in the pipeline.
    trust-inbound-headers: false
