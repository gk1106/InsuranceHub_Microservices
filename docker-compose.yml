name: insurance-hub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      # Host-side 3307 to avoid clashing with a local MySQL install on 3306; containers still
      # reach each other at mysql:3306 on the compose network regardless of this mapping.
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      # Advertised host port must match the docker-compose port mapping below (29093), or a
      # host-side client would connect fine but get told to reconnect on the wrong port.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg
    ports:
      # Host-side 29093 to avoid a local port clash; internal traffic still uses kafka:9092.
      - "29093:29092"
    healthcheck:
      # PLAINTEXT is bound to kafka:9092 specifically (not 0.0.0.0), so localhost:9092 refuses
      # the connection even from inside this same container - the healthcheck must target kafka:9092.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/insurancehub-realm.json:/opt/keycloak/data/import/insurancehub-realm.json:ro
    ports:
      # Host-side 8190 to avoid a local port clash; hub-gateway reaches it as keycloak:8080.
      - "8190:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    # Host-side ports shifted by 1 to avoid a local port clash. Nothing sends traces/metrics to
    # this yet (that's phase 8), so no other service config references these ports.
    ports:
      - "3001:3000"
      - "4327:4317"
      - "4328:4318"

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  claims-service:
    build:
      context: .
      dockerfile: claims-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      policy-service:
        condition: service_healthy

  hub-gateway:
    build:
      context: .
      dockerfile: hub-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      # Host-side 8090 to avoid a local port clash; internal port stays 8080.
      - "8090:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      claims-service:
        condition: service_healthy

volumes:
  mysql-data:
