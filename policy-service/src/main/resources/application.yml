spring:
  application:
    name: policy-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hub:
  correlation:
    # hub-gateway is the only caller (private subnets, security groups) and always sets
    # X-Req-Id/X-Insp-Id/X-Txn-Id, so it's safe to trust them here. Defaults to false in
    # hub-common - this must stay explicit.
    trust-inbound-headers: true
