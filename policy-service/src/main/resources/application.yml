spring:
  application:
    name: policy-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    template:
      # cross-cutting.md §2: "Kafka producer observation must be enabled so traces continue
      # through the outbox relay." Records a span around each OutboxRelay publish; the
      # traceparent OutboxRelay restores as a Kafka header (phase 7) is a separate mechanism -
      # this is what makes the *local* publish call itself show up as a span at all.
      observation-enabled: true
  task:
    scheduling:
      shutdown:
        # server.shutdown=graceful only drains Tomcat's own request-handling pool - it does not,
        # by itself, wait for an in-flight @Scheduled OutboxRelay tick to finish. Without this,
        # a rolling deploy (phase 9) could cut a tick off mid-batch; the relay's own single
        # wrapping transaction already makes that data-safe (nothing partially commits), but
        # this avoids the unnecessary rollback/retry churn on every deploy.
        await-termination: true
        await-termination-period: 10s

server:
  port: 8081
  shutdown: graceful

management:
  server:
    # cross-cutting.md §4: "Actuator is exposed on the management port only." A separate port
    # (not the app port) so /actuator/** - including /actuator/prometheus, a scrape target - is
    # never reachable through the same ALB listener/security-group rule as business traffic.
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # cross-cutting.md §2: "100% locally, 10% in prod." Only local/test profiles exist today
      # (phase 9 adds a real prod profile) - 1.0 here, a prod override recorded as a to-do in
      # docs/open-questions.md rather than silently forgotten.
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hub:
  internal-auth:
    # docs/adr/0007-internal-service-auth.md. Same literal default across all three services so
    # ITs (no compose, no env var) work with zero extra wiring; docker-compose.yml sets the same
    # INTERNAL_AUTH_SECRET on all three for the real stack, phase 9 sources it from Secrets
    # Manager. This default is not a real secret - never rely on it outside local/test.
    secret: ${INTERNAL_AUTH_SECRET:local-dev-internal-secret-CHANGE-ME}
  correlation:
    # hub-gateway is the only caller (private subnets, security groups) and always sets
    # X-Req-Id/X-Insp-Id/X-Txn-Id, so it's safe to trust them here. Defaults to false in
    # hub-common - this must stay explicit.
    trust-inbound-headers: true

outbox:
  relay:
    batch-size: 100
    send-timeout: 5s
    # alert-attempts: still retried every 500ms past this, but each further failure logs at
    # ERROR instead of WARN (a phase-9 CloudWatch metric filter turns that into a page) -
    # ~1 minute of continuous retries at the fixed 500ms delay.
    alert-attempts: 120
    # max-attempts: the much-higher safety valve that finally excludes a row from the relay's
    # own SELECT (~8 minutes) - never hit by a normal broker blip, only by a payload that will
    # truly never succeed (docs/adr/0006-outbox-relay.md).
    max-attempts: 1000
    topic: insurancehub.policy.events.v1
