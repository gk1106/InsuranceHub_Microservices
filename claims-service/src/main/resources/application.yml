spring:
  application:
    name: claims-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    template:
      # cross-cutting.md §2: "Kafka producer observation must be enabled so traces continue
      # through the outbox relay." Records a span around each OutboxRelay publish; the
      # traceparent OutboxRelay restores as a Kafka header (phase 7) is a separate mechanism -
      # this is what makes the *local* publish call itself show up as a span at all.
      observation-enabled: true
  task:
    scheduling:
      shutdown:
        # server.shutdown=graceful only drains Tomcat's own request-handling pool - it does not,
        # by itself, wait for an in-flight @Scheduled OutboxRelay tick to finish. Without this,
        # a rolling deploy (phase 9) could cut a tick off mid-batch; the relay's own single
        # wrapping transaction already makes that data-safe (nothing partially commits), but
        # this avoids the unnecessary rollback/retry churn on every deploy.
        await-termination: true
        await-termination-period: 10s

server:
  port: 8082
  shutdown: graceful

management:
  server:
    # cross-cutting.md §4: "Actuator is exposed on the management port only."
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

policy-service:
  base-url: http://policy-service:8081
  # cross-cutting.md §6: start with connect 2s, read 5s.
  #
  # Worst-case latency this implies for one POST /internal/claims call, when policy-service is
  # up but hanging (the dominant worst case - a read timeout is longer than a connect timeout,
  # and Retry re-attempts the whole call, not just the connect): 3 attempts x 5s read-timeout +
  # backoff between attempts (200ms, then 400ms - see resilience4j.retry below) = 15.6s. This is
  # the accepted ceiling on how long registration can block before returning
  # DOWNSTREAM_UNAVAILABLE - it is NOT enforced by an overall deadline here, so any caller of
  # this endpoint (hub-gateway, from phase 5) must set its own timeout for claims-service longer
  # than 15.6s, or this bound is moot from the caller's perspective.
  connect-timeout: 2s
  read-timeout: 5s

hub:
  internal-auth:
    # docs/adr/0007-internal-service-auth.md. Same literal default across all three services so
    # ITs (no compose, no env var) work with zero extra wiring; docker-compose.yml sets the same
    # INTERNAL_AUTH_SECRET on all three for the real stack, phase 9 sources it from Secrets
    # Manager. This default is not a real secret - never rely on it outside local/test.
    secret: ${INTERNAL_AUTH_SECRET:local-dev-internal-secret-CHANGE-ME}
  correlation:
    # hub-gateway is the only caller (private subnets, security groups) and always sets
    # X-Req-Id/X-Insp-Id/X-Txn-Id, so it's safe to trust them here. Defaults to false in
    # hub-common - this must stay explicit.
    trust-inbound-headers: true

outbox:
  relay:
    batch-size: 100
    send-timeout: 5s
    # alert-attempts: still retried every 500ms past this, but each further failure logs at
    # ERROR instead of WARN (a phase-9 CloudWatch metric filter turns that into a page) -
    # ~1 minute of continuous retries at the fixed 500ms delay.
    alert-attempts: 120
    # max-attempts: the much-higher safety valve that finally excludes a row from the relay's
    # own SELECT (~8 minutes) - never hit by a normal broker blip, only by a payload that will
    # truly never succeed (docs/adr/0006-outbox-relay.md).
    max-attempts: 1000
    topic: insurancehub.claim.events.v1

claims:
  status:
    # service-design.md §3's sample, used verbatim. Provisional - docs/open-questions.md Q3.
    terminal: [CLOSED, REPUDIATED, CANCELLED]
    transitions:
      REGISTERED: [UNDER_PROCESS, CLOSED, REPUDIATED, CANCELLED]
      # UNDER_PROCESS lists itself: re-affirming a claim still under process (e.g. while
      # updating claimCode/settlement fields) is a valid, distinct event, not a no-op - see Q3.
      UNDER_PROCESS: [UNDER_PROCESS, REQUIREMENT_PENDING, CLOSED, REPUDIATED, CANCELLED]
      REQUIREMENT_PENDING: [UNDER_PROCESS, CLOSED, REPUDIATED, CANCELLED]

resilience4j:
  circuitbreaker:
    instances:
      policyService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        # Allow-list, not the default "everything counts": a 404 (policy not found) is a
        # legitimate business outcome, never a service-health signal, so it must not open the
        # circuit. Only connectivity/server failures count.
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      policyService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # cross-cutting.md §6: never retry on 4xx - only connect errors, timeouts and 503.
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.ResourceAccessException
  bulkhead:
    # Phase 8 gap-fill - hub-gateway's own downstream clients already had this
    # (cross-cutting.md §6); same shape as hub-gateway's own bulkhead config.
    instances:
      policyService:
        max-concurrent-calls: 25
        max-wait-duration: 0
